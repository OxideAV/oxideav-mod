[package]
name = "oxideav-mod"
version = "0.0.10"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-mod"
authors = ["Mark Karpeles"]
description = "Amiga ProTracker / SoundTracker module (MOD) codec for oxideav"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-mod"
keywords = ["multimedia", "audio", "tracker", "amiga", "mod"]
categories = ["multimedia::audio"]

[dependencies]
oxideav-core = "0.1"

[dev-dependencies]
# `ureq` powers the URL-backed `halluc.mod` regression test. The fixture
# is hosted at https://samples.oxideav.org/magicaltux/mod/halluc.mod and
# cached on disk under `target/test-fixtures/` after the first fetch so
# repeat runs are offline and fast.
ureq = "3"
# `libloading` is used by `tests/tracker_reference_compare.rs` to
# dlopen a trace reference impl at runtime as a black-box behaviour
# oracle for per-row playback comparison. The crate gracefully skips
# the test if the reference dylib isn't installed — there is no
# compile-time link.
libloading = "0.9"
